:root{
  --paper:#f4efe3;
  --card:#fffdf7;
  --ink:#211e1a;
  --muted:#7c7264;
  --line:#e7ddc9;
  --red:#c0452b;
  --green:#275f53;
  --gold:#e9c86b;
  --serif:"Noto Serif SC","Noto Serif CJK SC","Source Han Serif SC","Songti SC","STSong","SimSun",Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  background:#e9e1d1;
  overflow-x:hidden;
  color:var(--ink);
  font-family:var(--sans);
  font-size:15px;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior:none;
}
button{font-family:inherit}

.app{
  position:relative;
  width:100%;
  max-width:480px;
  height:100dvh;
  margin:0 auto;
  background:var(--paper);
  display:flex;
  flex-direction:column;
  overflow:hidden;
  box-shadow:0 0 90px rgba(60,40,15,.16);
}
.app::before{
  content:"";
  position:absolute;inset:0;
  background:
    radial-gradient(700px 380px at 78% -8%,rgba(255,255,255,.85),transparent 62%),
    radial-gradient(520px 320px at 6% 4%,rgba(233,200,107,.16),transparent 60%);
  pointer-events:none;
}

/* ---------- 顶栏 ---------- */
.topbar{
  position:relative;z-index:5;
  display:flex;align-items:center;justify-content:space-between;
  padding:calc(16px + env(safe-area-inset-top)) 20px 8px;
  flex:0 0 auto;
}
.brand{display:flex;align-items:center;gap:10px}
.logo{
  width:34px;height:34px;border-radius:11px;
  background:var(--red);color:#fff8ec;
  font-family:var(--serif);font-size:18px;font-weight:400;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 6px 14px -8px rgba(192,69,43,.9);
  transform:rotate(-3deg);
}
.brand-txt{display:flex;flex-direction:column;line-height:1.15}
.brand-txt b{font-family:var(--serif);font-size:16px;letter-spacing:.06em;font-weight:400}
.brand-txt i{font-style:normal;font-size:8.5px;letter-spacing:.19em;color:#a89b86;margin-top:3px}
.ghost-btn{
  border:1px solid var(--line);background:rgba(255,253,247,.7);
  color:var(--muted);font-size:12px;letter-spacing:.08em;
  padding:7px 13px;border-radius:99px;cursor:pointer;transition:.18s;
}
.ghost-btn:active{transform:scale(.96)}

/* ---------- 主体 ---------- */
.main{
  position:relative;z-index:2;
  flex:1 1 auto;overflow-y:auto;overflow-x:hidden;
  padding:6px 18px calc(158px + env(safe-area-inset-bottom));
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
}
.main::-webkit-scrollbar{display:none}

.dayline{display:flex;align-items:flex-end;justify-content:space-between;margin:6px 2px 14px}
.dayline .d1{font-family:var(--serif);font-size:19px;letter-spacing:.02em}
.dayline .d2{font-size:10px;letter-spacing:.2em;color:#a89b86;margin-top:4px;text-transform:uppercase}
.streak{
  display:flex;align-items:center;gap:5px;
  font-size:11px;color:var(--red);
  background:rgba(192,69,43,.08);border:1px solid rgba(192,69,43,.16);
  padding:5px 10px;border-radius:99px;letter-spacing:.04em;
}
.streak b{font-family:var(--serif);font-size:13px}

/* ---------- 今日卡片 ---------- */
.card{
  position:relative;
  background:var(--card);
  border:1px solid #efe6d5;
  border-radius:26px;
  padding:20px 20px 22px;
  box-shadow:0 26px 46px -30px rgba(74,52,24,.6),0 2px 6px rgba(74,52,24,.05);
}
.card::before{
  content:"";position:absolute;top:-1px;left:26px;right:26px;height:1px;
  background:linear-gradient(90deg,transparent,rgba(192,69,43,.4),transparent);
}
.card.enter{animation:cardIn .34s cubic-bezier(.22,.8,.3,1) both}
@keyframes cardIn{
  from{opacity:0;transform:translateY(14px) scale(.99)}
  to{opacity:1;transform:none}
}

.ctop{display:flex;align-items:center;gap:7px;margin-bottom:15px}
.no{font-family:var(--serif);font-size:11.5px;letter-spacing:.1em;color:var(--red);font-weight:400}
.chip{
  font-size:10.5px;letter-spacing:.05em;color:#8a7f6e;
  border:1px solid var(--line);border-radius:99px;padding:3px 8px;
  background:#fdfaf3;
}
.chip.cat{color:var(--green);border-color:rgba(39,95,83,.22);background:rgba(39,95,83,.05)}

.icon-btn{
  background:none;border:0;padding:5px;margin-right:-2px;color:#c0b4a0;
  cursor:pointer;line-height:0;transition:.18s;
}
.icon-btn.first{margin-left:auto}
.icon-btn svg{width:18px;height:18px}
.icon-btn:active{transform:rotate(-40deg)}

.fav{
  background:none;border:0;padding:5px;margin-right:-5px;
  color:#c9bda9;cursor:pointer;line-height:0;transition:.18s;
}
.fav svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.6}
.fav.on{color:var(--red)}
.fav.on svg{fill:var(--red);stroke:var(--red)}
.fav:active{transform:scale(.86)}

.card h1{
  font-family:var(--serif);
  font-size:clamp(22px,6.1vw,27px);
  line-height:1.46;
  font-weight:400;
  letter-spacing:.005em;
  margin:0 0 13px;
}
.hook{
  font-size:14px;line-height:1.8;color:var(--muted);
  margin:0 0 18px;padding-left:12px;
  border-left:2px solid var(--line);
}

.blk{margin-bottom:15px}
.blk h4{
  font-size:10px;letter-spacing:.2em;color:#a08a5e;font-weight:700;
  margin:0 0 7px;display:flex;align-items:center;gap:6px;
}
.blk h4::before{
  content:"";width:5px;height:5px;background:currentColor;
  border-radius:1px;transform:rotate(45deg);flex:0 0 auto;
}
.blk p{font-size:15px;line-height:1.88;margin:0;color:#3c372e}

.kid{background:#fbf3dc;padding:14px 15px;border-radius:15px}
.kid h4{color:#a1802c}

.why{padding-top:15px;border-top:1px dashed var(--line)}

.use{
  background:linear-gradient(155deg,#2e7161,#1d4f45);
  color:#eef3ec;padding:16px;border-radius:17px;margin-bottom:0;
  box-shadow:0 14px 26px -20px rgba(29,79,69,.9);
}
.use h4{color:#a5d3c6}
.use p{color:#e8f0e9}

.tags{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0 0}
.tag{font-size:10px;color:#a39889;letter-spacing:.03em}

/* ---------- 操作区 ---------- */
.acts{display:flex;gap:10px;margin-top:16px}
.btn{
  flex:1;height:50px;border-radius:16px;border:1px solid var(--line);
  background:rgba(255,253,247,.9);color:var(--ink);
  font-size:14px;font-weight:600;letter-spacing:.03em;
  display:flex;align-items:center;justify-content:center;gap:7px;
  cursor:pointer;transition:transform .15s,background .15s;
}
.btn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.btn.primary{background:var(--ink);color:#f7f2e6;border-color:var(--ink);flex:1.35}
.btn:active{transform:scale(.976)}

.hint{
  text-align:center;font-size:11px;color:#a89b86;
  margin:18px 0 0;letter-spacing:.03em;line-height:1.7;
}

/* ---------- 原理馆 ---------- */
.sec-hd{font-family:var(--serif);font-size:22px;margin:12px 2px 6px;letter-spacing:.01em}
.sec-sub{font-size:12.5px;color:var(--muted);line-height:1.75;margin:0 2px 18px}

.lab-item{
  display:flex;gap:13px;align-items:flex-start;
  padding:15px 15px 16px;background:var(--card);
  border:1px solid #efe6d5;border-radius:18px;margin-bottom:10px;
  cursor:pointer;transition:transform .16s,box-shadow .16s;
  box-shadow:0 8px 20px -20px rgba(74,52,24,.7);
}
.lab-item:active{transform:scale(.988)}
.lab-em{font-size:23px;line-height:1.15;flex:0 0 auto}
.lab-item h3{font-family:var(--serif);font-size:16.5px;line-height:1.5;margin:0 0 5px;font-weight:400}
.lab-item p{margin:0;font-size:12px;color:var(--muted);line-height:1.65}
.lab-go{
  margin-left:auto;align-self:center;color:#c9bda9;font-size:16px;
  flex:0 0 auto;padding-left:4px;
}

/* ---------- 我的 ---------- */
.me-card{
  background:var(--card);border:1px solid #efe6d5;border-radius:20px;
  padding:16px 17px;margin-bottom:12px;
  box-shadow:0 10px 26px -26px rgba(74,52,24,.8);
}
.me-card h3{
  font-family:var(--serif);font-size:14px;margin:0 0 4px;
  letter-spacing:.04em;display:flex;align-items:center;gap:7px;
}
.me-card h3 span{font-size:14px}
.me-note{font-size:11.5px;color:#a39889;line-height:1.7;margin:0 0 10px}

.row{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid #f2ead9}
.row:last-child{border-bottom:0;padding-bottom:2px}
.row .lbl{font-size:13.5px;flex:1 1 auto;padding-right:12px;min-width:0}
.row .lbl small{display:block;font-size:10.5px;color:#a89b86;margin-top:3px;line-height:1.5}
.row .val{font-size:13px;color:var(--muted);font-family:var(--serif);flex:0 0 auto;white-space:nowrap}

.sw{
  width:46px;height:27px;border-radius:99px;background:#ddd2be;
  position:relative;transition:background .24s;border:0;cursor:pointer;flex:0 0 auto;
}
.sw::after{
  content:"";position:absolute;width:21px;height:21px;border-radius:50%;
  background:#fff;top:3px;left:3px;transition:transform .24s;
  box-shadow:0 1px 3px rgba(0,0,0,.22);
}
.sw.on{background:var(--red)}
.sw.on::after{transform:translateX(19px)}

input[type=time]{
  width:120px;
  border:1px solid var(--line);background:#fffdf7;border-radius:10px;
  padding:6px 10px;font-size:14px;font-family:var(--serif);color:var(--ink);
  outline:none;
}

.stats{display:flex;gap:9px;margin-bottom:12px}
.stat{
  flex:1;background:var(--card);border:1px solid #efe6d5;border-radius:17px;
  padding:14px 8px 12px;text-align:center;
}
.stat b{display:block;font-family:var(--serif);font-size:22px;line-height:1.2;color:var(--red)}
.stat span{font-size:10px;color:#a89b86;letter-spacing:.06em}

.mini-fav{
  display:flex;align-items:center;gap:10px;padding:10px 0;
  border-bottom:1px solid #f2ead9;cursor:pointer;
}
.mini-fav:last-child{border-bottom:0;padding-bottom:2px}
.mini-fav .em{font-size:17px}
.mini-fav .tx{font-size:12.5px;line-height:1.5;flex:1;color:#433d34}
.mini-fav .ar{color:#c9bda9;font-size:14px}

.empty{font-size:12px;color:#b0a596;padding:14px 0 16px;text-align:center;line-height:1.8}

/* ---------- 底部导航 ---------- */
.fade{
  position:absolute;left:0;right:0;bottom:0;height:126px;z-index:15;pointer-events:none;
  background:linear-gradient(to bottom,rgba(244,239,227,0) 0%,rgba(244,239,227,.72) 44%,var(--paper) 82%);
}

.tabbar{
  position:absolute;z-index:20;
  left:14px;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));
  height:62px;display:flex;
  background:rgba(255,253,247,.92);
  backdrop-filter:blur(22px) saturate(1.5);
  -webkit-backdrop-filter:blur(22px) saturate(1.5);
  border:1px solid rgba(231,221,201,.9);
  border-radius:22px;
  box-shadow:0 18px 32px -20px rgba(74,52,24,.55);
  padding:6px;
}
.tabbar button{
  flex:1;background:none;border:0;border-radius:17px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  color:#a89b86;font-size:10px;letter-spacing:.06em;cursor:pointer;transition:.2s;
}
.tabbar svg{
  width:20px;height:20px;fill:none;stroke:currentColor;
  stroke-width:1.55;stroke-linecap:round;stroke-linejoin:round;
}
.tabbar svg .fill{fill:currentColor;stroke:none}
.tabbar button.on{color:var(--red);background:rgba(192,69,43,.07)}

/* ---------- 详情面板 ---------- */
.sheet{position:fixed;inset:0;z-index:50;pointer-events:none;overflow:hidden}
.sheet-mask{position:absolute;inset:0;background:rgba(28,23,16,.45);opacity:0;transition:opacity .3s}
.sheet-body{
  position:absolute;left:0;right:0;bottom:0;margin:0 auto;
  transform:translateY(100%);
  width:100%;max-width:480px;max-height:90dvh;
  overflow-y:auto;-webkit-overflow-scrolling:touch;
  background:var(--paper);
  border-radius:26px 26px 0 0;
  padding:0 22px calc(34px + env(safe-area-inset-bottom));
  transition:transform .34s cubic-bezier(.22,.8,.3,1);
  scrollbar-width:none;
}
.sheet-body::-webkit-scrollbar{display:none}
.sheet.on{pointer-events:auto}
.sheet.on .sheet-mask{opacity:1}
.sheet.on .sheet-body{transform:translateY(0)}

.sd-top{
  position:sticky;top:0;z-index:2;
  background:linear-gradient(var(--paper) 76%,rgba(244,239,227,0));
  padding:10px 0 6px;
}
.grab{width:38px;height:4px;border-radius:99px;background:#d9cfbb;margin:0 auto}
.sd-em{font-size:38px;line-height:1;margin:18px 0 10px}
.sd-title{font-family:var(--serif);font-size:23px;line-height:1.45;margin:0 0 11px;font-weight:400}
.sd-one{font-size:14px;line-height:1.85;color:#5b5245;margin:0}

.steps{margin:24px 0 4px;border-left:1.5px solid #e2d6bd;padding-left:19px}
.step{position:relative;margin-bottom:19px}
.step::before{
  content:"";position:absolute;left:-25px;top:5px;width:9px;height:9px;border-radius:50%;
  background:var(--red);box-shadow:0 0 0 4px var(--paper);
}
.step b{display:block;font-size:12.5px;letter-spacing:.02em;margin-bottom:5px;color:var(--red);font-weight:700}
.step p{margin:0;font-size:13.8px;line-height:1.85;color:#433d34}

.money{
  background:#fbf3dc;border-radius:16px;padding:15px 16px;margin:18px 0;
  font-size:13.4px;line-height:1.9;color:#5a4b25;
}
.money b{display:block;font-size:10px;letter-spacing:.2em;color:#a1802c;margin-bottom:7px}

.remember{
  border-left:3px solid var(--red);padding:1px 0 1px 14px;
  font-family:var(--serif);font-size:15px;line-height:1.85;color:#3a352d;margin:20px 0 6px;
}
.sd-close{
  width:100%;height:48px;border-radius:15px;border:1px solid var(--line);
  background:rgba(255,253,247,.9);color:var(--muted);font-size:13px;
  margin-top:20px;cursor:pointer;
}

/* ---------- toast ---------- */
.toast{
  position:fixed;left:50%;bottom:calc(94px + env(safe-area-inset-bottom));
  transform:translate(-50%,18px);
  background:rgba(33,30,26,.94);color:#f7f2e6;
  font-size:12.5px;line-height:1.5;padding:11px 18px;border-radius:99px;
  opacity:0;transition:.26s;pointer-events:none;z-index:99;
  max-width:78%;text-align:center;
  box-shadow:0 12px 26px -14px rgba(0,0,0,.6);
}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------- 桌面 ---------- */
@media (min-width:560px){
  body{padding:0}
  .app{height:100dvh}
}

/* ---------- 信息流 ---------- */
.filters{
  display:flex;gap:7px;overflow-x:auto;
  margin:0 -18px 14px;padding:0 18px 2px;
  scrollbar-width:none;
}
.filters::-webkit-scrollbar{display:none}
.filter{
  flex:0 0 auto;border:1px solid var(--line);background:rgba(255,253,247,.8);
  color:#8a7f6e;font-size:12px;padding:6px 12px;border-radius:99px;
  cursor:pointer;white-space:nowrap;transition:.16s;
}
.filter.on{background:var(--ink);color:#f7f2e6;border-color:var(--ink)}

.feed-item{
  background:var(--card);border:1px solid #efe6d5;border-radius:16px;
  padding:14px 15px;margin-bottom:9px;cursor:pointer;transition:transform .15s;
  box-shadow:0 8px 20px -22px rgba(74,52,24,.8);
}
.feed-item:active{transform:scale(.988)}
.fi-top{display:flex;align-items:center;gap:6px;margin-bottom:7px}
.fi-src{font-size:11px;color:var(--green);font-weight:600;letter-spacing:.03em}
.fi-cat{font-size:10px;color:#a89b86;border-left:1px solid var(--line);padding-left:6px}
.fi-ai{font-size:9px;color:#a1802c;background:#fbf3dc;padding:2px 6px;border-radius:99px}
.fi-lang{font-size:9px;color:#9a8f7d;border:1px solid var(--line);padding:2px 5px;border-radius:99px}
.fi-time{margin-left:auto;font-size:10px;color:#b0a596;font-variant-numeric:tabular-nums}
.feed-item h3{
  font-family:var(--serif);font-size:15.5px;line-height:1.55;
  margin:0 0 5px;font-weight:400;letter-spacing:.005em;
}
.feed-item p{
  margin:0;font-size:12px;line-height:1.68;color:var(--muted);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}

a.src-link{text-decoration:none;display:block;transition:.18s}
a.src-link:active{transform:scale(.99)}
.src-link .go{float:right;opacity:.75;font-size:14px}

.sd-origin{font-size:11.5px;color:#a39889;margin:0 0 10px;line-height:1.6}
.sd-link{
  display:flex;align-items:center;justify-content:center;height:48px;
  border-radius:15px;background:var(--ink);color:#f7f2e6;
  text-decoration:none;font-size:14px;margin-top:12px;letter-spacing:.03em;
}

.feed-hd{display:flex;align-items:center;justify-content:space-between}
.feed-hd .sec-hd{margin-bottom:4px}

/* 手机扫码卡片 */
.qr-wrap{display:flex;justify-content:center;padding:6px 0 10px}
.qr-wrap img{width:170px;height:170px;border-radius:14px;border:1px solid var(--line);background:#fff;padding:8px}
.qr-url{
  text-align:center;font-family:var(--serif);font-size:13px;color:var(--green);
  letter-spacing:.02em;word-break:break-all;
}

.offline-tag{
  font-size:10.5px;color:#a89b86;letter-spacing:.08em;
  border:1px solid var(--line);border-radius:99px;padding:4px 10px;
}

</style>
</head>
<body>

<div class="app" id="app">

  <header class="topbar">
    <div class="brand">
      <span class="logo">差</span>
      <span class="brand-txt">
        <b>每日信息差</b>
        <i>WORLD, IN PLAIN WORDS</i>
      </span>
    </div>
    <button class="ghost-btn" id="btnToday" title="回到今天">今天</button>
  </header>

  <main id="main" class="main"></main>

  <div class="fade"></div>

  <nav class="tabbar" id="tabbar">
    <button data-view="today" class="on">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.2"/><circle cx="12" cy="12" r="3" class="fill"/></svg>
      <span>今天</span>
    </button>
    <button data-view="feed">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6.5h16M4 12h16M4 17.5h9"/><circle cx="19" cy="17.5" r="1.4" class="fill"/></svg>
      <span>信息流</span>
    </button>
    <button data-view="lab">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.2 14.6 9l6.2.6-4.7 4.1 1.4 6.1L12 16.6 6.5 19.8l1.4-6.1L3.2 9.6 9.4 9z"/></svg>
      <span>原理馆</span>
    </button>
    <button data-view="me">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8.4" r="3.6"/><path d="M4.8 20.2c.8-3.9 3.8-6 7.2-6s6.4 2.1 7.2 6"/></svg>
      <span>我的</span>
    </button>
  </nav>

</div>

<div class="sheet" id="sheet" aria-hidden="true">
  <div class="sheet-mask" data-close></div>
  <div class="sheet-body" id="sheetBody"></div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ==========================================================
   内容库 · 每天一条「信息差」 + 行业原理「说人话」
   每个条目都按同一套结构写，方便卡片渲染
   ========================================================== */

window.DAILY = [
  {
    id: "jp-fruit", em: "🍈", region: "日本", cat: "消费",
    title: "在日本，水果常常不是拿来吃的，是拿来送的",

 'lullaby' save coral reefs from extinction?", "brief": "科学家用海底扬声器播放声音、培育超级珊瑚等方式，试图挽救全球珊瑚礁；相关研究发表于《自然》。", "kid": "科学家在海底放喇叭播“摇篮曲”，想把小鱼小虾吸引回珊瑚礁安家；还像选壮苗一样，培育更耐热的珊瑚。", "why": "珊瑚礁退化影响渔业和海岸防护；这类修复手段若奏效，沿海居民和潜水旅游行业会直接受益。", "link": "https://www.nature.com/articles/d41586-026-03414-3", "source": "Nature", "region": "英国", "lang": "en", "cat": "科技", "time": "", "ts": 0, "summary_raw": "Nature, Published online: 22 October 2026; doi:10.1038/d41586-026-03414-3 From underwater speakers to growing super-corals, scientists battle to save reefs around the world."}, {"id": "c5dce0902f", "title": "CRISPR首次：先导编辑直接在人体内改DNA", "original_title": "A first for CRISPR: powerful prime editing alters DNA directly in the human body", "brief": "临床试验首次在人体内直接使用高精度先导编辑技术修改DNA，用于治疗一种可致肝和神经损伤的遗传病。", "kid": "以前改基因要把细胞取出来改好再放回去，这次像直接进屋修电线，在病人身体里改DNA，精度更高。", "why": "遗传病患者多了一种可能根治的治疗路径；但体内编辑的安全性和费用仍是普通人要关注的门槛。", "link": "https://www.nature.com/articles/d41586-026-03371-x", "source": "Nature", "region": "英国", "lang": "en", "cat": "科技", "time": "", "ts": 0, "summary_raw": "Nature, Published online: 22 October 2026; doi:10.1038/d41586-026-03371-x Application of the high-precision technique is part of a clinical trial to treat a genetic disease that can cause liver and nerve damage."}, {"id": "5f01aeeef4", "title": "童年大脑发育可预测青少年抑郁焦虑", "original_title": "Teen depression and anxiety predicted by childhood brain development", "brief": "研究分析近3万份脑部扫描，绘出大脑成熟时间线，发现童年大脑发育异常与青少年抑郁、焦虑相关。", "kid": "科学家看了近3万张大脑照片，发现大脑按时间表长大；如果某个阶段长得太快或太慢，孩子到青春期更容易情绪低落。", "why": "家长可更早关注孩子情绪变化；也提示学校心理筛查或可结合脑发育指标，但别把扫描当成算命。", "link": "https://www.nature.com/articles/d41586-026-03357-9", "source": "Nature", "region": "英国", "lang": "en", "cat": "社会", "time": "", "ts": 0, "summary_raw": "Nature, Published online: 22 October 2026; doi:10.1038/d41586-026-03357-9 Analysis of nearly 30,000 brain scans yields detailed timeline of how the brain matures — and hints at the consequences of disrupting it."}, {"id": "03e266de41", "title": "数学能扛住AI吗？菲尔兹奖得主陶哲轩呼吁“数学2.0”", "original_title": "Can maths survive AI? Fields medallist Terence Tao calls for a ‘Maths 2.0’ world", "brief": "菲尔兹奖得主陶哲轩呼吁数学界进入“数学2.0”时代：机器解题速度加快后，应更重视人类理解，而非只追求发表更多解答。", "kid": "AI做题越来越快，就像计算器一秒算完一页口算；陶哲轩说，数学家不能只比谁答案多，要讲清楚为什么这么做。", "why": "数学研究和教学评价可能改变，学生学数学更重理解而非刷题；也影响AI辅助科研的规范与信任。", "link": "https://www.nature.com/articles/d41586-026-03389-1", "source": "Nature", "region": "英国", "lang": "en", "cat": "科技", "time": "", "ts": 0, "summary_raw": "Nature, Published online: 22 October 2026; doi:10.1038/d41586-026-03389-1 As machines race ahead in solving problems, mathematicians must establish a new era that prizes human understanding over simply publishing more solutions."}, {"id": "6242f76486", "title": "Oura再诉对手Ultrahuman，威胁其美国智能戒指回归", "original_title": "Oura sues rival Ultrahuman again, threatening its U.S. smart ring comeback", "brief": "Oura最新诉讼指控Ultrahuman的Ring Pro侵犯其两项专利。这是两家智能戒指厂商专利纠纷的再次升级。", "kid": "两家做智能戒指的公司又打官司了。Oura说对手新戒指偷用了自己的两个技术点子，想拦住它在美国卖。", "why": "专利战可能推高智能戒指价格或限制新品上市，想买这类产品的消费者选择会变少、变贵。", "link": "https://techcrunch.com/2026/10/22/oura-sues-rival-ultrahuman-again-threatening-its-u-s-smart-ring-comeback/", "source": "TechCrunch", "region": "美国", "lang": "en", "cat": "科技", "time": "10-23 12:22", "ts": 1792729377.0, "summary_raw": "Oura alleges in its newest lawsuit that Ultrahuman's Ring Pro infringes two of its patents."}, {"id": "8847558f6a", "title": "SK海力士股价先跌后反弹，Solidigm赴美IPO计划搁置", "original_title": "SK Hynix shares rebound after initial drop on scrapped Solidigm IPO plans", "brief": "SK海力士因暂停审查旗下Solidigm的美国IPO计划，股价早盘一度下跌，随后反弹回升。", "kid": "一家韩国芯片大公司原本想让子公司去美国上市，现在先不办了。消息一出股价先跌，后来又涨回来。", "why": "存储芯片巨头上市计划生变，反映行业融资节奏放缓，可能影响内存芯片供应和价格走势。", "link": "https://www.cnbc.com/2026/10/23/sk-hynix-solidigm-ipo-.html", "source": "CNBC", "region": "美国", "lang": "en", "cat": "商业", "time": "10-23 12:05", "ts": 1792728335.0, "summary_raw": "SK Hynix shares rebound after an inital drop in early trading, following halted review of Solidigm IPO <script>
(function () {
  "use strict";

  var DAILY = window.DAILY || [];
  var LAB = window.LAB || [];
  var WD = ["星期日", "星期一", "星期二", "星期三", "星期四", "星期五", "星期六"];

  /* ---------------- 存储 ---------------- */
  var store = {
    get: function (k, d) {
      try {
        var v = localStorage.getItem("dd_" + k);
        return v === null ? d : JSON.parse(v);
      } catch (e) { return d; }
    },
    set: function (k, v) {
      try { localStorage.setItem("dd_" + k, JSON.stringify(v)); } catch (e) {}
    }
  };

  var FEED = { items: [] };
  var NOTES = {};
  var LOCAL = null;

  var S = {
    fav: store.get("fav", []),
    read: store.get("read", []),
    streak: store.get("streak", 0),
    lastOpen: store.get("lastOpen", ""),
    push: store.get("push", { on: false, time: "08:30", last: "" }),
    view: "today",
    offset: 0,
    region: "全部"
  };

  /* ---------------- 工具 ---------------- */
  function $(s, r) { return (r || document).querySelector(s); }
  function dkey(d) {
    d = d || new Date();
    return d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate();
  }
  function dayOfYear(d) {
    var s = new Date(d.getFullYear(), 0, 0);
    return Math.floor((d - s) / 86400000);
  }
  function pad2(n) { return n < 10 ? "0" + n : "" + n; }
  function no3(n) { return ("00" + n).slice(-3); }

  function baseIdx() {
    return (dayOfYear(new Date()) * 7 + 5) % DAILY.length;
  }
  function currentItem() {
    var n = DAILY.length;
    return DAILY[((baseIdx() + S.offset) % n + n) % n];
  }
  function itemNo(it) {
    for (var i = 0; i < DAILY.length; i++) if (DAILY[i].id === it.id) return no3(i + 1);
    return "000";
  }
  function isFav(id) { return S.fav.indexOf(id) > -1; }
  function markRead(id) {
    if (S.read.indexOf(id) === -1) {
      S.read.push(id);
      store.set("read", S.read);
    }
  }

  var toastTimer = null;
  function toast(msg) {
    var t = $("#toast");
    t.textContent = msg;
    t.classList.add("on");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove("on"); }, 2400);
  }

  function touchStreak() {
    var t = dkey();
    if (S.lastOpen === t) return;
    var y = new Date(Date.now() - 86400000);
    S.streak = S.lastOpen === dkey(y) ? (S.streak || 0) + 1 : 1;
    S.lastOpen = t;
    store.set("streak", S.streak);
    store.set("lastOpen", S.lastOpen);
  }

  /* ---------------- 今日 ---------------- */
  function heartSVG() {
    return '<svg viewBox="0 0 24 24"><path d="M12 20.3s-7.5-4.6-7.5-9.6a4.35 4.35 0 0 1 7.5-2.95A4.35 4.35 0 0 1 19.5 10.7c0 5-7.5 9.6-7.5 9.6z"/></svg>';
  }

  /* 一条新闻的解读：优先用 ai-notes.json，其次用采集时生成的字段 */
  function noteOf(x) {
    if (!x) return null;
    if (NOTES[x.id]) return NOTES[x.id];
    if (x.kid) return { title: x.title, brief: x.brief, kid: x.kid, why: x.why, cat: x.cat };
    return null;
  }

  /* 早报、盘点这类合辑不适合当「今日精选」 */
  function isDigest(x) {
    var t = x.title || "";
    if (/早报|早知道|晚报|午报|日报|周报|盘点|一览|汇总|快讯集/.test(t)) return true;
    var marks = (t.match(/[；;]/g) || []).length;
    return marks >= 1 || t.length > 42;
  }

  function newsPool() {
    return (FEED.items || []).filter(function (x) { return noteOf(x) && !isDigest(x); });
  }

  function todayNews() {
    var pool = newsPool();
    if (!pool.length) return null;
    // 只在信息量最高的前 12 条里按天轮换
    var top = pool.slice(0, 12);
    var i = dayOfYear(new Date()) + S.offset;
    return top[((i % top.length) + top.length) % top.length];
  }
  function fmtTime(t) { return t || ""; }

  /* 当前该推什么：优先实时抓取的今日精选 */
  function headline() {
    var n = todayNews();
    if (n) {
      var note = noteOf(n);
      return { title: note.title, sub: n.source + " · " + n.region };
    }
    var it = currentItem();
    return { title: it.title, sub: "第 " + itemNo(it) + " 号 · " + it.region };
  }

  function viewToday() {
    var now = new Date();
    var md = (now.getMonth() + 1) + "月" + now.getDate() + "日";
    var n = todayNews();
    return n ? viewTodayNews(n, now, md) : viewTodayLocal(now, md);
  }

  function daylineHTML(now, md) {
    return '<div class="dayline">' +
        '<div>' +
          '<div class="d1">' + md + ' · ' + WD[now.getDay()] + '</div>' +
          '<div class="d2">DAY ' + dayOfYear(now) + ' / 今日份</div>' +
        '</div>' +
        '<div class="streak">连续 <b>' + (S.streak || 1) + '</b> 天</div>' +
      '</div>';
  }

  function pushHintText() {
    return S.push.on
      ? "每天 " + S.push.time + " 自动送来 · 可在「我的」里修改"
      : "推送还没开 · 去「我的」设一个时间，到点自动来";
  }

  function actionHTML() {
    return '<div class="acts">' +
        '<button class="btn primary" data-act="next">' +
          '<svg viewBox="0 0 24 24"><path d="M4 12h15M13 6l6 6-6 6"/></svg>换一条' +
        '</button>' +
        '<button class="btn" data-act="share">' +
          '<svg viewBox="0 0 24 24"><path d="M12 15V4M8 8l4-4 4 4"/><path d="M5 14v5a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-5"/></svg>分享' +
        '</button>' +
      '</div>';
  }

  /* 今日卡：来自实时抓取 + AI 解读 */
  function viewTodayNews(n, now, md) {
    var note = noteOf(n);
    markRead(n.id);
    var src = n.link
      ? '<a class="blk use src-link" href="' + n.link + '" target="_blank" rel="noopener">' +
          '<h4>去读原文</h4>' +
          '<p>' + n.source + ' · ' + n.region + '<span class="go">↗</span></p>' +
        '</a>'
      : '<div class="blk use"><h4>来源</h4><p>' + n.source + ' · ' + n.region + '</p></div>';

    return daylineHTML(now, md) +
      '<article class="card enter" id="card">' +
        '<div class="ctop">' +
          '<span class="no">今日精选</span>' +
          '<span class="chip">' + n.source + '</span>' +
          '<span class="chip cat">' + (note.cat || n.cat) + '</span>' +
          '<button class="icon-btn first" data-act="next" aria-label="换一条">' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.4-5.7"/><path d="M20 3.4v4.9h-4.9"/></svg>' +
          '</button>' +
          '<button class="fav ' + (isFav(n.id) ? "on" : "") + '" data-act="fav" data-id="' + n.id + '" aria-label="收藏">' + heartSVG() + '</button>' +
        '</div>' +

        '<h1>' + note.title + '</h1>' +
        '<p class="hook">' + note.brief + '</p>' +

        '<div class="blk kid">' +
          '<h4>说人话</h4>' +
          '<p>' + note.kid + '</p>' +
        '</div>' +

        '<div class="blk why">' +
          '<h4>信息差到底差在哪</h4>' +
          '<p>' + note.why + '</p>' +
        '</div>' +

        src +

        '<div class="tags">' +
          '<span class="tag">#' + n.source + '</span>' +
          '<span class="tag">#' + n.region + '</span>' +
          '<span class="tag">#' + fmtTime(n.time) + ' 抓取</span>' +
        '</div>' +
      '</article>' +

      actionHTML() +
      '<p class="hint">' + pushHintText() + '<br>今日这条来自实时抓取，全部 ' +
        (FEED.count || 0) + ' 条在「信息流」里。</p>';
  }

  /* 今日卡：内置精选（没有网络或没有解读时的兜底） */
  function viewTodayLocal(now, md) {
    var it = currentItem();
    markRead(it.id);

    return daylineHTML(now, md) +
      '<article class="card enter" id="card">' +
        '<div class="ctop">' +
          '<span style="font-size:17px;line-height:1">' + it.em + '</span>' +
          '<span class="no">No.' + itemNo(it) + '</span>' +
          '<span class="chip">' + it.region + '</span>' +
          '<span class="chip cat">' + it.cat + '</span>' +
          '<button class="icon-btn first" data-act="next" aria-label="换一条">' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.4-5.7"/><path d="M20 3.4v4.9h-4.9"/></svg>' +
          '</button>' +
          '<button class="fav ' + (isFav(it.id) ? "on" : "") + '" data-act="fav" data-id="' + it.id + '" aria-label="收藏">' + heartSVG() + '</button>' +
        '</div>' +

        '<h1>' + it.title + '</h1>' +
        '<p class="hook">' + it.hook + '</p>' +

        '<div class="blk kid">' +
          '<h4>说人话</h4>' +
          '<p>' + it.kid + '</p>' +
        '</div>' +

        '<div class="blk why">' +
          '<h4>信息差到底差在哪</h4>' +
          '<p>' + it.why + '</p>' +
        '</div>' +

        '<div class="blk use">' +
          '<h4>你能怎么用</h4>' +
          '<p>' + it.use + '</p>' +
        '</div>' +

        '<div class="tags">' + it.tags.map(function (t) { return '<span class="tag">#' + t + '</span>'; }).join("") + '</div>' +
      '</article>' +

      actionHTML() +
      '<p class="hint">' + pushHintText() + '<br>今日这条是固定的，换一条只是加餐。</p>';
  }

  /* ---------------- 信息流 ---------------- */
  function viewFeed() {
    var items = FEED.items || [];
    if (!items.length) {
      return '<div class="sec-hd">信息流</div>' +
        '<p class="sec-sub">还没有抓到内容。在电脑上运行一次 <b>python3 collector.py</b>，' +
        '或者用本地服务打开这个页面（<b>python3 serve.py</b>），它就会自动更新。</p>';
    }

    var regions = [];
    items.forEach(function (x) {
      if (regions.indexOf(x.region) < 0) regions.push(x.region);
    });
    var cur = S.region;
    var list = items.filter(function (x) { return cur === "全部" || x.region === cur; });

    var filters = ['全部'].concat(regions).map(function (r) {
      return '<button class="filter ' + (r === cur ? "on" : "") + '" data-act="region" data-id="' + r + '">' + r + '</button>';
    }).join("");

    var html = list.map(function (x) {
      var note = noteOf(x);
      var title = note ? note.title : x.title;
      var desc = note ? note.brief : (x.brief || "").slice(0, 90);
      if (!desc) desc = x.lang === "zh" ? "" : "英文原文 · 配置 AI 后可自动翻成中文";
      return '' +
        '<div class="feed-item" data-act="openNews" data-id="' + x.id + '">' +
          '<div class="fi-top">' +
            '<span class="fi-src">' + x.source + '</span>' +
            '<span class="fi-cat">' + (note && note.cat ? note.cat : x.cat) + '</span>' +
            (note ? '<span class="fi-ai">AI 解读</span>' : '') +
            (x.lang !== "zh" ? '<span class="fi-lang">原文</span>' : '') +
            '<span class="fi-time">' + (x.time || "") + '</span>' +
          '</div>' +
          '<h3>' + title + '</h3>' +
          (desc ? '<p>' + desc + '</p>' : '') +
        '</div>';
    }).join("");

    return '<div class="feed-hd">' +
        '<div class="sec-hd">信息流</div>' +
        (window.__FEED__ ? '<span class="offline-tag">离线版</span>'
                         : '<button class="ghost-btn" data-act="refresh">刷新</button>') +
      '</div>' +
      '<p class="sec-sub">' + (FEED.generated_at || "") + ' 更新 · ' +
        (FEED.count || items.length) + ' 条 · ' + (FEED.sources_ok || "?") + ' 个源' +
        (FEED.llm ? '' : ' · 英文源保留原文') + '</p>' +
      '<div class="filters">' + filters + '</div>' +
      html;
  }

  /* ---------------- 原理馆 ---------------- */
  function viewLab() {
    var list = LAB.map(function (p) {
      return '' +
        '<div class="lab-item" data-act="openLab" data-id="' + p.id + '">' +
          '<div class="lab-em">' + p.em + '</div>' +
          '<div style="flex:1">' +
            '<h3>' + p.title + '</h3>' +
            '<p>' + p.one + '</p>' +
          '</div>' +
          '<div class="lab-go">›</div>' +
        '</div>';
    }).join("");

    return '' +
      '<div class="sec-hd">原理馆</div>' +
      '<p class="sec-sub">挑一个你每天都在用、却从没搞懂的东西。每篇拆成 4~5 步，读完大约 2 分钟，不用懂任何专业词。</p>' +
      list;
  }

  /* ---------------- 我的 ---------------- */
  function permText() {
    if (!("Notification" in window)) return "这个浏览器不支持系统通知";
    var p = Notification.permission;
    if (p === "granted") return "系统通知已允许";
    if (p === "denied") return "系统通知被拒绝，可在浏览器设置里改";
    return "还没允许系统通知";
  }

  function viewMe() {
    var favs = S.fav.map(function (id) {
      var it = null;
      for (var i = 0; i < DAILY.length; i++) if (DAILY[i].id === id) it = DAILY[i];
      if (!it) return "";
      return '' +
        '<div class="mini-fav" data-act="openDaily" data-id="' + it.id + '">' +
          '<span class="em">' + it.em + '</span>' +
          '<span class="tx">' + it.title + '</span>' +
          '<span class="ar">›</span>' +
        '</div>';
    }).join("");

    var canNotify = "Notification" in window;

    return '' +
      '<div class="sec-hd">我的</div>' +
      '<p class="sec-sub">数据都存在你这台设备上，不上传、不登录。</p>' +

      '<div class="stats">' +
        '<div class="stat"><b>' + (S.streak || 1) + '</b><span>连续天数</span></div>' +
        '<div class="stat"><b>' + S.read.length + '</b><span>已读条目</span></div>' +
        '<div class="stat"><b>' + S.fav.length + '</b><span>收藏</span></div>' +
      '</div>' +

      '<div class="me-card">' +
        '<h3><span>⏰</span>每天自动推送</h3>' +
        '<p class="me-note">到点把当天的卡片推到你手机上。需要先允许系统通知；如果没允许，打开 App 也会直接看到当天内容。</p>' +
        '<div class="row">' +
          '<div class="lbl">开启每日推送<small>' + permText() + '</small></div>' +
          '<button class="sw ' + (S.push.on ? "on" : "") + '" data-act="swPush" aria-label="开关"></button>' +
        '</div>' +
        '<div class="row">' +
          '<div class="lbl">推送时间</div>' +
          '<input type="time" id="pushTime" value="' + S.push.time + '" data-change="pushTime">' +
        '</div>' +
        '<div class="row">' +
          '<div class="lbl">通知权限</div>' +
          '<button class="ghost-btn" data-act="askPerm">' + (canNotify ? "申请" : "不支持") + '</button>' +
        '</div>' +
        '<div class="row">' +
          '<div class="lbl">现在就试一条<small>看看推送长什么样</small></div>' +
          '<button class="ghost-btn" data-act="testPush">发送</button>' +
        '</div>' +
      '</div>' +

      (LOCAL ? '<div class="me-card">' +
        '<h3><span>▣</span>在手机上打开</h3>' +
        '<p class="me-note">手机连同一个 WiFi，扫码即开。打开后点浏览器菜单里的「添加到主屏幕」，下次一点就进。</p>' +
        '<div class="qr-wrap"><img src="./qr.png" alt="手机访问二维码" onerror="this.parentNode.style.display=\'none\'"></div>' +
        '<div class="qr-url">' + LOCAL.url + '</div>' +
      '</div>' : '') +

      '<div class="me-card">' +
        '<h3><span>◎</span>数据源</h3>' +
        '<p class="me-note">' + (FEED.generated_at
            ? '最后更新 ' + FEED.generated_at + '，收录 ' + (FEED.count || 0) + ' 条，' + (FEED.sources_ok || 0) + ' 个源可用。'
            : '还没有抓到内容。运行 collector.py 抓一次，或 serve.py 让它每天自动更新。') +
          '要让它每天自动抓，在电脑上运行 <b>python3 serve.py</b>，页面保持打开即可。' +
        '</p>' +
        '<div class="row"><div class="lbl">AI 解读<small>配置 DD_LLM_KEY 后自动生成</small></div>' +
          '<div class="val">' + (FEED.items || []).filter(function (x) { return x.kid; }).length + ' 条</div></div>' +
        '<div class="row"><div class="lbl">英文源<small>没配 AI 时保留原文</small></div>' +
          '<div class="val">' + (FEED.items || []).filter(function (x) { return x.lang !== 'zh'; }).length + ' 条</div></div>' +
      '</div>' +

      '<div class="me-card">' +
        '<h3><span>♥</span>我的收藏</h3>' +
        (favs || '<p class="empty">还没有收藏。看到想留着的，点卡片右上角那颗心。</p>') +
      '</div>' +

      '<div class="me-card">' +
        '<h3><span>✎</span>关于这个小东西</h3>' +
        '<p class="me-note">每天一条：一个国家和它「反常识」的日常。原理馆：把行业拆成小学生也能跟上的步骤。</p>' +
        '<div class="row">' +
          '<div class="lbl">装到桌面<small>iPhone：分享 → 添加到主屏幕；安卓：菜单 → 安装应用</small></div>' +
          '<div class="val">像 App 一样</div>' +
        '</div>' +
        '<div class="row">' +
          '<div class="lbl">内容数量<small>每天轮换，看完自动循环</small></div>' +
          '<div class="val">' + DAILY.length + ' + ' + LAB.length + ' 篇</div>' +
        '</div>' +
        '<div class="row">' +
          '<div class="lbl">数据存在哪<small>只在这台设备，不登录、不上传</small></div>' +
          '<div class="val">本机</div>' +
        '</div>' +
      '</div>';
  }

  /* ---------------- 渲染 ---------------- */
  function render() {
    var main = $("#main");
    var html;
    if (S.view === "feed") html = viewFeed();
    else if (S.view === "lab") html = viewLab();
    else if (S.view === "me") html = viewMe();
    else html = viewToday();
    main.innerHTML = html;
    main.scrollTop = 0;

    var tabs = document.querySelectorAll("#tabbar button");
    for (var i = 0; i < tabs.length; i++) {
      tabs[i].classList.toggle("on", tabs[i].getAttribute("data-view") === S.view);
    }
  }

  /* ---------------- 详情面板 ---------------- */
  var sheet = $("#sheet");
  var sheetBody = $("#sheetBody");

  function openSheet() {
    sheet.classList.add("on");
    sheet.setAttribute("aria-hidden", "false");
    document.body.style.overflow = "hidden";
  }
  function closeSheet() {
    sheet.classList.remove("on");
    sheet.setAttribute("aria-hidden", "true");
    document.body.style.overflow = "";
    setTimeout(function () { if (!sheet.classList.contains("on")) sheetBody.innerHTML = ""; }, 360);
  }

  function openLab(id) {
    var p = null;
    for (var i = 0; i < LAB.length; i++) if (LAB[i].id === id) p = LAB[i];
    if (!p) return;

    var steps = p.steps.map(function (s) {
      return '<div class="step"><b>' + s.t + '</b><p>' + s.d + '</p></div>';
    }).join("");

    sheetBody.innerHTML = '' +
      '<div class="sd-top"><div class="grab"></div></div>' +
      '<div class="sd-em">' + p.em + '</div>' +
      '<h2 class="sd-title">' + p.title + '</h2>' +
      '<p class="sd-one">' + p.one + '</p>' +
      '<div class="steps">' + steps + '</div>' +
      '<div class="money"><b>钱是怎么分的</b>' + p.money + '</div>' +
      '<div class="remember">' + p.remember + '</div>' +
      '<button class="sd-close" data-close>收起</button>';
    openSheet();
  }

  function openNews(id) {
    var n = null;
    (FEED.items || []).forEach(function (x) { if (x.id === id) n = x; });
    if (!n) return;
    var note = noteOf(n);

    var head = '<div class="sd-top"><div class="grab"></div></div>' +
      '<div style="display:flex;gap:6px;align-items:center;margin:16px 0 10px">' +
        '<span class="chip">' + n.source + '</span>' +
        '<span class="chip cat">' + (note && note.cat ? note.cat : n.cat) + '</span>' +
        '<span class="fi-time" style="margin-left:auto">' + (n.time || "") + '</span>' +
      '</div>';

    var body = '<h2 class="sd-title">' + (note ? note.title : n.title) + '</h2>';

    if (n.original_title) {
      body += '<p class="sd-origin">' + n.original_title + '</p>';
    }

    if (note) {
      body += '<p class="sd-one">' + note.brief + '</p>' +
        '<div class="blk kid" style="margin-top:18px"><h4>说人话</h4><p>' + note.kid + '</p></div>' +
        '<div class="blk why"><h4>信息差到底差在哪</h4><p>' + note.why + '</p></div>';
    } else {
      var raw = n.summary_raw || n.brief || "";
      if (raw) body += '<p class="sd-one">' + raw + '</p>';
    }

    body += '<div class="money" style="margin-top:20px"><b>原始来源</b>' +
      n.source + ' · ' + n.region + (n.link ? '' : ' · 无链接') + '</div>';

    if (n.link) {
      body += '<a class="sd-link" href="' + n.link + '" target="_blank" rel="noopener">去读原文 ↗</a>';
    }

    sheetBody.innerHTML = head + body +
      '<button class="sd-close" data-close>收起</button>';
    openSheet();
  }

  function openDaily(id) {
    var it = null;
    for (var i = 0; i < DAILY.length; i++) if (DAILY[i].id === id) it = DAILY[i];
    if (!it) return;

    sheetBody.innerHTML = '' +
      '<div class="sd-top"><div class="grab"></div></div>' +
      '<div class="sd-em">' + it.em + '</div>' +
      '<div style="display:flex;gap:6px;margin-bottom:10px">' +
        '<span class="chip">' + it.region + '</span><span class="chip cat">' + it.cat + '</span>' +
      '</div>' +
      '<h2 class="sd-title">' + it.title + '</h2>' +
      '<p class="sd-one">' + it.hook + '</p>' +
      '<div class="blk kid" style="margin-top:18px"><h4>说人话</h4><p>' + it.kid + '</p></div>' +
      '<div class="blk why"><h4>信息差到底差在哪</h4><p>' + it.why + '</p></div>' +
      '<div class="blk use"><h4>你能怎么用</h4><p>' + it.use + '</p></div>' +
      '<button class="sd-close" data-close>收起</button>';
    openSheet();
  }

  /* ---------------- 推送 ---------------- */
  function canNotify() { return "Notification" in window; }

  function notify(title, body) {
    try {
      if (canNotify() && Notification.permission === "granted") {
        new Notification(title, { body: body, tag: "dd-daily", renotify: true });
        return true;
      }
    } catch (e) {
      /* 部分手机浏览器要求走 Service Worker，失败就退回 App 内提示 */
    }
    return false;
  }

  function askPerm() {
    if (!canNotify()) { toast("这个浏览器不支持系统通知"); return; }
    if (Notification.permission === "granted") { toast("已经是允许状态了"); return; }
    Notification.requestPermission().then(function (r) {
      render();
      if (r === "granted") toast("好了，到点我会来叫你");
      else toast("没授权。打开 App 也能看到当天内容");
    }).catch(function () { toast("这个环境不支持申请通知"); });
  }

  function testPush() {
    var h = headline();
    var ok = notify(h.title, h.sub);
    if (!ok) toast("没有通知权限，这里是预览：" + h.title);
    else toast("已发送，看看通知栏");
  }

  function checkPush() {
    if (!S.push.on) return;
    if (!canNotify() || Notification.permission !== "granted") return;
    var now = new Date();
    var t = dkey(now);
    if (S.push.last === t) return;
    var parts = String(S.push.time).split(":");
    var h = parseInt(parts[0], 10) || 0;
    var m = parseInt(parts[1], 10) || 0;
    var target = new Date(now.getFullYear(), now.getMonth(), now.getDate(), h, m, 0, 0);
    if (now >= target) {
      var h = headline();
      notify(h.title, h.sub);
      if (!document.hidden) toast("到点了 · 今天的内容已更新");
      S.push.last = t;
      store.set("push", S.push);
    }
  }

  /* ---------------- 事件 ---------------- */
  $("#main").addEventListener("click", function (e) {
    var el = e.target.closest("[data-act]");
    if (!el) return;
    var act = el.getAttribute("data-act");
    var id = el.getAttribute("data-id");

    if (act === "fav") {
      var i = S.fav.indexOf(id);
      if (i > -1) { S.fav.splice(i, 1); toast("已取消收藏"); }
      else { S.fav.unshift(id); toast("收好了，在「我的」里能找到"); }
      store.set("fav", S.fav);
      render();
    } else if (act === "next") {
      S.offset = (S.offset + 1) % DAILY.length;
      render();
    } else if (act === "refresh") {
      toast("正在抓取，大概要 30 秒…");
      fetch("./api/refresh", { method: "POST" })
        .then(function (r) { return r.json(); })
        .then(function (f) {
          if (f && f.items && f.items.length) {
            FEED = f;
            render();
            toast("已更新 · " + f.count + " 条");
          } else {
            toast("没抓到新内容，稍后再试");
          }
        })
        .catch(function () { toast("需要在电脑上运行 python3 serve.py 才能实时抓取"); });
    } else if (act === "region") {
      S.region = id;
      render();
    } else if (act === "openNews") {
      openNews(id);
    } else if (act === "share") {
      var n = todayNews();
      var title, text;
      if (n) {
        var note = noteOf(n);
        title = note.title;
        text = note.title + "\n\n" + note.brief + "\n\n" + note.kid + "\n\n—— 每日信息差 · 来自 " + n.source;
      } else {
        var it = currentItem();
        title = it.title;
        text = it.title + "\n\n" + it.hook + "\n\n" + it.kid + "\n\n—— 每日信息差 No." + itemNo(it);
      }
      if (navigator.share) {
        navigator.share({ title: title, text: text }).catch(function () {});
      } else if (navigator.clipboard) {
        navigator.clipboard.writeText(text).then(function () { toast("已复制，去粘贴给朋友"); }).catch(function () {
          toast("长按文字可以手动复制");
        });
      } else {
        toast("长按文字可以手动复制");
      }
    } else if (act === "openLab") {
      openLab(id);
    } else if (act === "openDaily") {
      openDaily(id);
    } else if (act === "swPush") {
      S.push.on = !S.push.on;
      store.set("push", S.push);
      render();
      if (S.push.on) {
        if (canNotify() && Notification.permission === "default") askPerm();
        else toast("已开启，每天 " + S.push.time + " 推给你");
      } else {
        toast("已关闭每日推送");
      }
    } else if (act === "askPerm") {
      askPerm();
    } else if (act === "testPush") {
      testPush();
    }
  });

  $("#main").addEventListener("change", function (e) {
    var el = e.target.closest("[data-change]");
    if (!el) return;
    if (el.getAttribute("data-change") === "pushTime") {
      S.push.time = el.value || "08:30";
      S.push.last = "";
      store.set("push", S.push);
      toast("推送时间改成 " + S.push.time);
      render();
    }
  });

  $("#tabbar").addEventListener("click", function (e) {
    var b = e.target.closest("button[data-view]");
    if (!b) return;
    S.view = b.getAttribute("data-view");
    if (S.view === "today") S.offset = 0;
    render();
  });

  $("#btnToday").addEventListener("click", function () {
    S.view = "today";
    S.offset = 0;
    render();
  });

  sheet.addEventListener("click", function (e) {
    if (e.target.closest("[data-close]")) closeSheet();
  });

  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") closeSheet();
  });

  /* 下拉一点点时给顶栏加阴影（细节） */
  var mainEl = $("#main");
  mainEl.addEventListener("scroll", function () {
    $(".topbar").style.boxShadow = mainEl.scrollTop > 6 ? "0 8px 18px -18px rgba(74,52,24,.8)" : "none";
  }, { passive: true });

  /* ---------------- 加载实时内容 ---------------- */
  function loadFeed() {
    // 单文件离线版：数据直接嵌在页面里
    if (window.__FEED__) {
      FEED = window.__FEED__;
      NOTES = window.__NOTES__ || {};
      render();
      return;
    }
    if (!window.fetch) return;
    function j(u) {
      return fetch(u, { cache: "no-store" }).then(function (r) {
        return r.ok ? r.json() : null;
      }).catch(function () { return null; });
    }
    Promise.all([j("./feed.json"), j("./ai-notes.json"), j("./local.json")]).then(function (res) {
      if (res[0] && res[0].items && res[0].items.length) FEED = res[0];
      if (res[1] && res[1].notes) NOTES = res[1].notes;
      if (res[2] && res[2].url) LOCAL = res[2];
      if (S.view === "today" || S.view === "feed") render();
    }).catch(function () {});
  }

  /* ---------------- 启动 ---------------- */
  touchStreak();
  render();
  loadFeed();
  setTimeout(checkPush, 1200);
  setInterval(checkPush, 20000);

  /* 页面重新可见时立刻补一次检查（手机后台会冻结定时器） */
  document.addEventListener("visibilitychange", function () {
    if (!document.hidden) setTimeout(checkPush, 400);
  });

  /* 第一次来，给一句引导 */
  if (!store.get("seen", false)) {
    setTimeout(function () {
      toast("右上角换一条 · 底部还有信息流和原理馆");
      store.set("seen", true);
    }, 1600);
  }

  /* 装到桌面 + 断网可用 */
  if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("./sw.js").catch(function () {});
    });
  }

  /* 支持用链接直达某一页 / 某一条（方便分享） */
  (function () {
    var qs = new URLSearchParams(location.search);
    var v = qs.get("v");
    if (v === "lab" || v === "me") { S.view = v; render(); }
    var id = qs.get("id");
    if (id) {
      for (var i = 0; i < LAB.length; i++) if (LAB[i].id === id) { openLab(id); return; }
      for (var j = 0; j < DAILY.length; j++) if (DAILY[j].id === id) { openDaily(id); return; }
    }
  })();
})();

</script>
</body>
</html>
