<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#f5f0e5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>每日信息差 · 小学生也能看懂</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-title" content="每日信息差">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app" id="app">

  <header class="topbar">
    <div class="brand">
      <span class="logo">差</span>
      <span class="brand-txt">
        <b>每日信息差</b>
        <i>WORLD, IN PLAIN WORDS</i>
      </span>
    </div>
    <button class="ghost-btn" id="btnToday" title="回到今天">今天</button>
  </header>

  <main id="main" class="main"></main>

  <div class="fade"></div>

  <nav class="tabbar" id="tabbar">
    <button data-view="today" class="on">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.2"/><circle cx="12" cy="12" r="3" class="fill"/></svg>
      <span>今天</span>
    </button>
    <button data-view="feed">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6.5h16M4 12h16M4 17.5h9"/><circle cx="19" cy="17.5" r="1.4" class="fill"/></svg>
      <span>信息流</span>
    </button>
    <button data-view="lab">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.2 14.6 9l6.2.6-4.7 4.1 1.4 6.1L12 16.6 6.5 19.8l1.4-6.1L3.2 9.6 9.4 9z"/></svg>
      <span>原理馆</span>
    </button>
    <button data-view="me">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8.4" r="3.6"/><path d="M4.8 20.2c.8-3.9 3.8-6 7.2-6s6.4 2.1 7.2 6"/></svg>
      <span>我的</span>
    </button>
  </nav>

</div>

<div class="sheet" id="sheet" aria-hidden="true">
  <div class="sheet-mask" data-close></div>
  <div class="sheet-body" id="sheetBody"></div>
</div>

<div class="toast" id="toast"></div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
